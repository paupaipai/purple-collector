
[functions.delete-account]
enabled = true
# JWT verification happens inside the function itself via withSupabase({ auth: ["user"] }),
# which checks the caller's token against the project JWKS — this isn't a bypass.
verify_jwt = false
import_map = "./functions/delete-account/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-account/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-account/*.html" ]

[functions.send-notification]
enabled = true
# Platform-level JWT verification stays on (contract requirement) — the
# withSupabase({ auth: ["user"] }) check inside the handler is on top of it,
# not instead of it, and additionally enforces the is_admin check.
verify_jwt = true
import_map = "./functions/send-notification/deno.json"
entrypoint = "./functions/send-notification/index.ts"

[functions.moderate-card-image]
enabled = true
# Igual que send-notification: la verificacion de JWT de plataforma queda
# encendida, y el withSupabase({ auth: ["user"] }) + el chequeo de is_admin del
# handler van encima, no en su lugar.
verify_jwt = true
import_map = "./functions/moderate-card-image/deno.json"
entrypoint = "./functions/moderate-card-image/index.ts"

[functions.moderate-card-submission]
enabled = true
# Igual que moderate-card-image: la verificacion de JWT de plataforma queda
# encendida, y el withSupabase({ auth: ["user"] }) + el chequeo de is_admin del
# handler van encima, no en su lugar.
verify_jwt = true
import_map = "./functions/moderate-card-submission/deno.json"
entrypoint = "./functions/moderate-card-submission/index.ts"
